<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Finantial Student</title>
<style>
  :root{
    --paper:#e7e3d6;
    --paper-raised:#f1eee2;
    --ink:#20281f;
    --ink-soft:#4c5347;
    --line:rgba(32,40,31,0.22);
    --accent:#e2572f;
    --accent-ink:#ffffff;
    --go:#2e7d4f;
    --go-soft:#e3efe6;
    --hold:#a9731a;
    --hold-soft:#f3e9d6;
    --stop:#a3402d;
    --stop-soft:#f1ddd6;
    --shadow:0 18px 40px -20px rgba(32,40,31,0.45);
  }
  :root[data-theme="dark"]{
    --paper:#1b1a15;
    --paper-raised:#242219;
    --ink:#ece7d6;
    --ink-soft:#b9b3a0;
    --line:rgba(236,231,214,0.22);
    --accent:#ff7a52;
    --accent-ink:#1b1a15;

  }

      --paper:#1b1a15;
      --paper-raised:#242219;
      --ink:#ece7d6;
      --ink-soft:#b9b3a0;
      --line:rgba(236,231,214,0.22);
      --accent:#ff7a52;
      --accent-ink:#1b1a15;
      --go:#6fcf97;
      --go-soft:#20352a;
      --hold:#e0ad52;
      --hold-soft:#3a2f1c;
      --stop:#ea8470;
      --stop-soft:#3a241f;
      --shadow:0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="light"]{
    --paper:#e7e3d6;
    --paper-raised:#f1eee2;
    --ink:#20281f;
    --ink-soft:#4c5347;
    --line:rgba(32,40,31,0.22);
    --accent:#e2572f;
    --accent-ink:#ffffff;
    --go:#2e7d4f;
    --go-soft:#e3efe6;
    --hold:#a9731a;
    --hold-soft:#f3e9d6;
    --stop:#a3402d;
    --stop-soft:#f1ddd6;
    --shadow:0 18px 40px -20px rgba(32,40,31,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: ui-sans-serif, "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Liberation Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  .receipt{
    width:100%;
    max-width:460px;
    background:var(--paper-raised);
    box-shadow:var(--shadow);
    position:relative;
    padding:0 28px 36px;
    --notch:16px;
    --notch-count: 14;
  }
  .receipt::before, .receipt::after{
    content:"";
    display:block;
    height:var(--notch);
    background-image: radial-gradient(circle at 50% 0%, transparent calc(var(--notch) / 1.6), var(--paper) calc(var(--notch) / 1.6 + 1px));
    background-size: calc(100% / var(--notch-count)) var(--notch);
    background-repeat: repeat-x;
  }
  .receipt::after{ transform: rotate(180deg); }

  .quicknav{
    display:flex; justify-content:center; flex-wrap:wrap; gap:2px;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .quicknav button{
    background:transparent; border:none; font-size:15px; line-height:1;
    padding:6px 7px; border-radius:7px; cursor:pointer; color:var(--ink-soft);

  .quicknav button:hover{ background:var(--line); color:var(--ink); }
  .quicknav button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  header.masthead{

  .brand{

  }
  h1.title{

    letter-spacing:.03em;
    margin:10px 0 6px;
    text-transform:uppercase;
    text-wrap:balance;
  }
  .subtitle{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:340px;
    margin:0 auto;
    text-wrap:balance;
  }
  .barcode{
    margin:16px auto 0;
    height:30px;

  }

  .step{ padding-top:22px; animation: fadein .3s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .step{animation:none;} }

  .eyebrow{
    font-family: ui-monospace, "SF Mono", Consolas, monospace;

    letter-spacing:.15em;

    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
  }
  .eyebrow span:last-child{ text-align:right; }
  h2.q{
    font-size:19px;
    line-height:1.35;
    margin:0 0 16px;
    text-wrap:balance;
  }
  p.hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:-8px 0 16px;
    line-height:1.5;
  }

  .mode-select{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .mode-card{

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }

  .field input.mono{ font-size:17px; }
  .field input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .field select{
    width:100%; background:var(--paper-raised); border:1px solid var(--line); border-radius:8px;

  }

  button.primary{

  /* ---- Receipt itemization (results) ---- */

    border:3px solid currentColor;

  h2.q.sec{ margin-top:8px; font-size:16px; }

  .earn-item{ display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:5px 0; line-height:1.4; }

  .tip-card{ border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .tip-card-title{ font-weight:700; font-size:13px; margin-bottom:4px; }
  .tip-card-text{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .sim-result{ margin-top:4px; margin-bottom:6px; }

  /* ---- Wallet ---- */
  .wallet-balance{ text-align:center; margin:16px 0 22px; }
  .wallet-balance-label{
    font-size:11px; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.15em; font-family: ui-monospace, Consolas, monospace;
  }
  .wallet-balance-num{ font-size:34px; font-weight:800; margin-top:6px; }
  .use-wallet-btn{
    display:block; margin-top:6px; width:100%; text-align:left; font-size:11px; padding:7px 2px;

  /* ---- Stocks ---- */
  .field textarea{
    width:100%; background:transparent; border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; font-size:13.5px; color:var(--ink); font-family:inherit; resize:vertical; min-height:64px;

  .field textarea:focus{ outline:none; border-color:var(--accent); }
  .stock-card{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .stock-title{ font-weight:700; font-size:14px; margin-bottom:6px; }
  .stock-section-label{

  textarea.stock-input{ margin-bottom:0; }

  footer.sig{
    text-align:center; font-family: ui-monospace, Consolas, monospace;
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); margin-top:6px; text-transform:uppercase;
  }

  /* ---- History ---- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 20px; }
  .stat{ text-align:center; border:1px solid var(--line); border-radius:10px; padding:10px 6px; }
  .stat-num{ font-size:16px; font-weight:700; }
  .stat-label{ font-size:10px; color:var(--ink-soft); line-height:1.3; margin-top:4px; }

  .history-list{ display:flex; flex-direction:column; gap:10px; margin:6px 0 20px; }
  .history-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;

  .hrow-item{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

<div class="receipt" id="receipt">
  <header class="masthead">
    <div class="brand mono">Caixa Registradora · Decisão de Compra</div>
    <h1 class="title">Vale a Pena?</h1>
    <p class="subtitle">Antes de gastar a mesada, responde um check-up rápido. No final sai um cupom dizendo se é hora de comprar, esperar ou guardar o dinheiro.</p>
    <div class="barcode" aria-hidden="true"></div>
    <nav class="quicknav" aria-label="Navegação rápida">
      <button type="button" data-nav="home" title="Início">🏠</button>
      <button type="button" data-nav="wallet" title="Carteira">💰</button>
      <button type="button" data-nav="agenda" title="Agenda">📅</button>
      <button type="button" data-nav="history" title="Histórico">📜</button>
      <button type="button" data-nav="goals" title="Metas">🐷</button>
      <button type="button" data-nav="earn" title="Ganhar mais">📈</button>
      <button type="button" data-nav="stocks" title="Ações">📊</button>
    </nav>
  </header>

  <main id="app"></main>
</div>

<script>
(function(){
  "use strict";

  var HISTORY_KEY = "valeapena_v1_history";
  var GOALS_KEY = "valeapena_v1_goals";
  var WALLET_KEY = "valeapena_v1_wallet";

  // ---- Safe storage (falls back to memory if localStorage is blocked) ----
  var memStore = {};
  function storageGet(key){
    try { return localStorage.getItem(key); } catch(e){ return memStore[key] || null; }
  }
  function storageSet(key, val){
    try { localStorage.setItem(key, val); } catch(e){ memStore[key] = val; }
  }

  function loadHistory(){
    try { return JSON.parse(storageGet(HISTORY_KEY) || "[]"); } catch(e){ return []; }
  }
  function saveHistoryEntry(entry){
    var list = loadHistory();
    list.unshift(entry);
    storageSet(HISTORY_KEY, JSON.stringify(list.slice(0, 100)));
  }
  function clearHistory(){ storageSet(HISTORY_KEY, JSON.stringify([])); }
  function historyStats(list){
    var go = 0, hold = 0, stop = 0, savedAmount = 0;
    list.forEach(function(e){
      if (e.verdictKey === "go") go++;
      else if (e.verdictKey === "hold"){ hold++; savedAmount += Number(e.price) || 0; }

  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function daysInMonth(y, m){ return new Date(y, m + 1, 0).getDate(); }
  function daysBetween(a, b){ return Math.round((startOfDay(b).getTime() - startOfDay(a).getTime()) / 86400000); }
  function nextWeekdayDate(fromDate, weekday){
    var d = startOfDay(fromDate);
    var diff = (weekday - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function nextMonthDayDate(fromDate, day){
    var d = startOfDay(fromDate);
    var y = d.getFullYear(), m = d.getMonth();
    var candidate = new Date(y, m, Math.min(day, daysInMonth(y, m)));
    if (candidate < d){

      candidate = new Date(y, m, Math.min(day, daysInMonth(y, m)));
    }
    return candidate;
  }

  function effortLines(price){

    var daysInPeriod = state.period === "semana" ? 7 : 30;

    wrap.appendChild(priceField);

    var live = el("div", "liveline");
    live.appendChild(el("span", null, "Peso no seu orçamento"));
    live.appendChild(el("b", null, '<span id="live-pct">' + pctText() + '</span>'));
    wrap.appendChild(live);

    var effLine = el("div", "liveline");
    effLine.appendChild(el("span", null, "Equivale a"));
    effLine.appendChild(el("b", null, '<span id="live-effort">' + effortSummary(state.price) + '</span>'));
    wrap.appendChild(effLine);

    wrap.appendChild(progressBar(2));
    var nav = el("div", "nav");
    var back = el("button", "ghost", "← Voltar");
    back.onclick = function(){ state.step = 1; render(); };
    var next = el("button", "primary", "Continuar");
    next.disabled = !(state.item && state.price);
    next.onclick = function(){ if (state.item && state.price) { state.step = 3; render(); } };
    nav.appendChild(back);
    nav.appendChild(next);
    wrap.appendChild(nav);
    return wrap;
  }

  function renderQuestion(q){
    var idx = QUESTIONS.indexOf(q);
    var compareTag = state.mode === "compare" ? (" · Item " + state.compareStage) : "";
    var wrap = el("div", "step");
    wrap.appendChild(el("div", "eyebrow", "<span>Pergunta " + (idx+1) + " de " + QUESTIONS.length + compareTag + "</span><span>" + (state.step) + " / " + TOTAL_STEPS + "</span>"));
    wrap.appendChild(el("h2", "q", q.text()));

    var opts = el("div", "options");
    var current = state.answers[q.id];
    q.options.forEach(function(opt){
      var isSel = current && current.label === opt.label;
      var b = el("button", "option" + (isSel ? " selected" : ""));
      b.type = "button";
      var mark = el("span", "mark");
      var txt = el("span", null, opt.label);
      b.appendChild(mark);
      b.appendChild(txt);
      b.onclick = function(){ onQuestionAnswered(q, opt); };
      opts.appendChild(b);
    });
    wrap.appendChild(opts);

    wrap.appendChild(progressBar(state.step));
    var nav = el("div", "nav");
    var back = el("button", "ghost", "← Voltar");
    back.onclick = function(){ state.step = state.step - 1; render(); };
    nav.appendChild(back);
    nav.appendChild(el("span"));
    wrap.appendChild(nav);
    return wrap;
  }

  function onQuestionAnswered(q, opt){
    state.answers[q.id] = {label: opt.label, points: opt.points};
    var isLast = QUESTIONS.indexOf(q) === QUESTIONS.length - 1;
    if (!isLast){
      state.step = state.step + 1;
      render();
      return;
    }
    finishItemFlow();
  }

  function computeResult(){
    var lines = [];
    QUESTIONS.forEach(function(q){
      var a = state.answers[q.id];
      if (a) lines.push({label: q.text() + " → " + a.label, points: a.points});
    });
    var budget = budgetScoreLine();
    lines.push({label: budget.label, points: budget.points});
    var total = lines.reduce(function(sum, l){ return sum + l.points; }, 0);
    return {lines: lines, total: total};
  }

  function verdictFor(total){
    if (total >= 5) return {
      key:"go", stampBig:"Aprovado", stampSmall:"pode levar",
      text: "O placar ficou positivo (" + total + " pontos): " + (state.item || "o item") + " parece combinar com o que você gosta, cabe no seu bolso e não é só impulso do momento. Se quiser, vai com confiança."
    };
    if (total >= 0) return {
      key:"hold", stampBig:"Em análise", stampSmall:"espera uma semana",
      text: "Deu " + total + " ponto(s) — nem sim, nem não. Anota esse item numa lista e espera 7 dias sem comprar. Se depois desse tempo você ainda quiser do mesmo jeito, aí faz mais sentido comprar."
    };
    return {
      key:"stop", stampBig:"Não autorizado", stampSmall:"por enquanto",
      text: "O placar ficou negativo (" + total + " pontos). Vários sinais apontam pra impulso, pouco uso ou um orçamento apertado. Melhor guardar esse dinheiro agora e repensar " + (state.item || "esse item") + " mais pra frente."
    };
  }

  function tipFor(result, verdict){
    var worst = result.lines.reduce(function(a,b){ return b.points < a.points ? b : a; }, result.lines[0]);
    if (verdict.key === "go") return "💡 Dica: já que vale a pena, separa o valor assim que a mesada cair — antes que o dinheiro se dissolva em outras coisas pequenas.";
    if (worst.points <= -2 && worst.label.toLowerCase().indexOf("anúncio") !== -1) return "💡 Dica: quando a vontade nasce de um anúncio ou rede social, ela costuma passar em alguns dias. Vale testar a regra dos 7 dias antes de decidir.";
    if (worst.points <= -2 && worst.label.toLowerCase().indexOf("orçamento") !== -1) return "💡 Dica: gastar mais da metade do que você tem num único item deixa pouca margem pra imprevistos. Tenta dividir a mesada em \"gastar\", \"guardar\" e \"imprevisto\".";
    return "💡 Dica: antes de comprar, pergunte-se sempre: eu quero isso ou eu quero a sensação de comprar algo agora?";
  }

  function finishItemFlow(){
    var result = computeResult();
    var verdict = verdictFor(result.total);

    if (state.mode === "compare" && state.compareStage === "A"){
      state.compareResults.A = {item: state.item, price: state.price, result: result, verdict: verdict, won: false};
      state.item = ""; state.price = null; state.answers = {};
      state.compareStage = "B";
      state.step = 2;
      render();
      return;
    }
    if (state.mode === "compare" && state.compareStage === "B"){
      state.compareResults.B = {item: state.item, price: state.price, result: result, verdict: verdict, won: false};
      finalizeCompare();
      return;
    }

    saveHistoryEntry({
      id: "h" + Date.now(), date: new Date().toISOString(),
      item: state.item, price: state.price, total: result.total,
      verdictKey: verdict.key, mode: "single"
    });
    state.step = state.step + 1;
    render();
  }

  function finalizeCompare(){
    var A = state.compareResults.A, B = state.compareResults.B;
    var aWins;
    if (A.result.total === B.result.total) aWins = pricePctOf(A.price) <= pricePctOf(B.price);
    else aWins = A.result.total > B.result.total;
    A.won = aWins; B.won = !aWins;

    var now = new Date().toISOString();
    var base = Date.now();
    saveHistoryEntry({id:"h"+base+"a", date:now, item:A.item, price:A.price, total:A.result.total, verdictKey:A.verdict.key, mode:"compare", pairWith:B.item, won:A.won});
    saveHistoryEntry({id:"h"+base+"b", date:now, item:B.item, price:B.price, total:B.result.total, verdictKey:B.verdict.key, mode:"compare", pairWith:A.item, won:B.won});

    state.view = "compareResult";
    render();
  }

        state.view = "wallet";
        render();
      };

    }

      state.answers = {};
      render();
    };

    restart.onclick = function(){ state = defaultState(); render(); };
    nav.appendChild(restart);
    nav.appendChild(again);
    wrap.appendChild(nav);

    wrap.appendChild(el("footer", "sig", "Vale a Pena? · check-up de mesada"));
    return wrap;
  }

      render();

    var home = el("button", "primary", "Início");
    home.onclick = function(){ state = defaultState(); render(); };
    nav.appendChild(again);
    nav.appendChild(home);

  function statBlock(num, label){
    var s = el("div", "stat");
    s.appendChild(el("div", "stat-num mono", String(num)));
    s.appendChild(el("div", "stat-label", label));
    return s;
  }

  function renderHistory(){
    var wrap = el("div", "step");
    var history = loadHistory();
    wrap.appendChild(el("div", "eyebrow", "<span>Histórico</span><span>" + history.length + " registro(s)</span>"));
    wrap.appendChild(el("h2", "q", "Seu histórico de decisões"));

    if (history.length === 0){
      wrap.appendChild(el("p", "hint", "Você ainda não fez nenhum check-up. Avalie uma compra pra começar seu histórico."));
    } else {
      var stats = historyStats(history);
      var grid = el("div", "stat-grid");
      grid.appendChild(statBlock(stats.count, "check-ups feitos"));
      grid.appendChild(statBlock(stats.hold + stats.stop, "vezes que segurou a onda"));
      grid.appendChild(statBlock(fmtBRL(stats.savedAmount), "pensados 2x antes de gastar"));
      wrap.appendChild(grid);

      var list = el("div", "history-list");
      history.slice(0, 12).forEach(function(e){
        var row = el("div", "history-row");
        var d = new Date(e.date);
        var dateStr = isNaN(d.getTime()) ? "" : (d.getDate() + "/" + (d.getMonth()+1));
        var left = el("div", "hrow-main");
        var itemLine = (e.item || "item") + (e.pairWith ? (' <span class="hrow-vs">vs ' + e.pairWith + '</span>') : "");
        left.appendChild(el("span", "hrow-item", itemLine));
        left.appendChild(el("span", "hrow-date mono", dateStr + " · " + fmtBRL(Number(e.price) || 0)));
        row.appendChild(left);
        var chipCls = e.verdictKey === "go" ? "chip-go" : (e.verdictKey === "hold" ? "chip-hold" : "chip-stop");
        var chipLabel = e.verdictKey === "go" ? "Aprovado" : (e.verdictKey === "hold" ? "Esperou" : "Segurou");
        if (e.won === true) chipLabel = "🏆 " + chipLabel;
        else if (e.won === false) chipLabel = chipLabel + " (perdeu)";
        row.appendChild(el("span", "chip-tag " + chipCls, chipLabel));
        list.appendChild(row);
      });
      wrap.appendChild(list);

      var clearBtn = el("button", "ghost", "Limpar histórico");
      clearBtn.type = "button";
      clearBtn.onclick = function(){
        if (window.confirm("Apagar todo o histórico salvo neste navegador?")){
          clearHistory();
          render();
        }
      };
      wrap.appendChild(clearBtn);

    var nav = el("div", "nav");
    var back = el("button", "primary", "← Início");

    nav.appendChild(back);

      wrap.appendChild(el("p", "hint", "Quando o check-up disser pra guardar mais, você pode criar uma meta ali mesmo na tela de resultado — ela aparece aqui."));

      goals.forEach(function(g){
        var card = el("div", "goal-card");

            };

          };

          wrap.appendChild(card);

        card.appendChild(el("div", "goal-title", g.item || "item"));

          card.appendChild(el("div", "goal-sub", "Meta completa! 🎉"));

        var addRow = el("div", "goal-add-row");
        var addInput = document.createElement("input");
        addInput.type = "number"; addInput.min = "0"; addInput.className = "mono"; addInput.placeholder = "quanto guardou agora";
        var addBtn = el("button", "ghost", "+ Guardar");
        addBtn.type = "button";
        addBtn.onclick = function(){
          var v = Number(addInput.value);
          if (v > 0){ updateGoalFunded(g.id, v); render(); }

        card.appendChild(addRow);

        var actions = el("div", "goal-actions");
        var editBtn = el("button", "ghost", "✏️ Editar");
        editBtn.type = "button";
        editBtn.onclick = function(){ ui.editingGoalId = g.id; render(); };
        var doneBtn = el("button", "ghost", "✅ Comprei");
        doneBtn.type = "button";
        doneBtn.onclick = function(){ removeGoal(g.id); render(); };
        var delBtn = el("button", "ghost", "🗑️ Remover");
        delBtn.type = "button";
        delBtn.onclick = function(){
          if (window.confirm("Remover esta meta?")){ removeGoal(g.id); render(); }
        };
        actions.appendChild(editBtn); actions.appendChild(doneBtn); actions.appendChild(delBtn);
        card.appendChild(actions);

        wrap.appendChild(card);
      });
    }

    var nav = el("div", "nav");
    var back = el("button", "primary", "← Início");
    back.onclick = function(){ state.view = null; render(); };
    nav.appendChild(el("span"));
    nav.appendChild(back);
    wrap.appendChild(nav);
    return wrap;
  }

  // ---- Canvas receipt image (share / download) ----
  function cssVar(name, fallback){
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return v && v.trim() ? v.trim() : fallback;
  }
  function truncateText(s, n){
    s = s || "";
    return s.length > n ? s.slice(0, n-1) + "…" : s;
  }

  function buildReceiptCanvas(itemName, lines, total, verdict, effortStr){
    var W = 440;
    var padX = 26;
    var lineH = 24;
    var H = 170 + lines.length * lineH + (effortStr ? 24 : 0) + 230;

    var paper = cssVar("--paper-raised", "#f1eee2");
    var ink = cssVar("--ink", "#20281f");
    var inkSoft = cssVar("--ink-soft", "#4c5347");
    var go = cssVar("--go", "#2e7d4f");
    var hold = cssVar("--hold", "#a9731a");
    var stop = cssVar("--stop", "#a3402d");
    var lineCol = cssVar("--line", "rgba(32,40,31,0.3)");

    var canvas = document.createElement("canvas");
    var scale = 2;
    canvas.width = W * scale; canvas.height = H * scale;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";

    ctx.textAlign = "center";
    ctx.fillStyle = inkSoft;
    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.fillText("CAIXA REGISTRADORA · DECISÃO DE COMPRA", W/2, 26);
    ctx.fillStyle = ink;
    ctx.font = "800 26px ui-monospace, Consolas, monospace";
    ctx.fillText("VALE A PENA?", W/2, 56);
    ctx.fillStyle = inkSoft;
    ctx.font = "13px ui-sans-serif, Arial";
    ctx.fillText(truncateText(itemName, 44) || "item", W/2, 78);

    var y = 104;
    ctx.strokeStyle = lineCol; ctx.setLineDash([3,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(W - padX, y); ctx.stroke(); ctx.setLineDash([]);
    y += 24;

    ctx.textAlign = "left";
    lines.forEach(function(l){
      ctx.font = "12px ui-sans-serif, Arial";
      ctx.fillStyle = ink;
      ctx.fillText(truncateText(l.label, 50), padX, y);
      ctx.textAlign = "right";
      ctx.font = "700 12px ui-monospace, Consolas, monospace";
      ctx.fillStyle = l.points > 0 ? go : (l.points < 0 ? stop : inkSoft);
      ctx.fillText((l.points > 0 ? "+" : "") + l.points, W - padX, y);
      ctx.textAlign = "left";
      y += lineH;
    });

    ctx.strokeStyle = ink; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(W - padX, y); ctx.stroke();
    y += 26;
    ctx.font = "800 16px ui-monospace, Consolas, monospace";
    ctx.fillStyle = ink;
    ctx.fillText("TOTAL", padX, y);
    ctx.textAlign = "right";
    ctx.fillText((total > 0 ? "+" : "") + total + " pts", W - padX, y);
    ctx.textAlign = "left";
    y += 22;

    if (effortStr){
      ctx.font = "11px ui-sans-serif, Arial";
      ctx.fillStyle = inkSoft;
      ctx.fillText(truncateText(effortStr, 56), padX, y);
      y += 24;
    }

    y += 26;
    var stampColor = verdict.key === "go" ? go : (verdict.key === "hold" ? hold : stop);
    ctx.save();
    ctx.translate(W/2, y + 26);
    ctx.rotate(-4 * Math.PI / 180);
    ctx.strokeStyle = stampColor; ctx.lineWidth = 3;
    ctx.strokeRect(-130, -30, 260, 60);
    ctx.fillStyle = stampColor;
    ctx.textAlign = "center";
    ctx.font = "800 18px ui-monospace, Consolas, monospace";
    ctx.fillText(verdict.stampBig.toUpperCase(), 0, -6);
    ctx.font = "600 11px ui-monospace, Consolas, monospace";
    ctx.fillText(verdict.stampSmall.toUpperCase(), 0, 14);
    ctx.restore();

    y += 110;
    ctx.textAlign = "center";
    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.fillStyle = inkSoft;
    ctx.fillText("VALE A PENA? · CHECK-UP DE MESADA", W/2, y);

    return canvas;
  }

  function buildCompareCanvas(A, B){
    var W = 440, H = 360;
    var paper = cssVar("--paper-raised", "#f1eee2");
    var ink = cssVar("--ink", "#20281f");
    var inkSoft = cssVar("--ink-soft", "#4c5347");
    var go = cssVar("--go", "#2e7d4f");
    var hold = cssVar("--hold", "#a9731a");
    var stop = cssVar("--stop", "#a3402d");
    var lineCol = cssVar("--line", "rgba(32,40,31,0.3)");

    var canvas = document.createElement("canvas");
    var scale = 2;
    canvas.width = W * scale; canvas.height = H * scale;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "center";
    ctx.fillStyle = inkSoft;
    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.fillText("CAIXA REGISTRADORA · COMPARAÇÃO", W/2, 26);
    ctx.fillStyle = ink;
    ctx.font = "800 22px ui-monospace, Consolas, monospace";
    ctx.fillText("QUAL VALE MAIS A PENA?", W/2, 54);

    function block(entry, cx, fallbackLabel){
      var color = entry.verdict.key === "go" ? go : (entry.verdict.key === "hold" ? hold : stop);
      ctx.font = "700 13px ui-sans-serif, Arial"; ctx.fillStyle = ink;
      ctx.fillText(truncateText(entry.item || fallbackLabel, 20), cx, 100);
      ctx.font = "11px ui-sans-serif, Arial"; ctx.fillStyle = inkSoft;
      ctx.fillText(fmtBRL(Number(entry.price) || 0), cx, 118);
      ctx.font = "800 32px ui-monospace, Consolas, monospace"; ctx.fillStyle = color;
      ctx.fillText((entry.result.total > 0 ? "+" : "") + entry.result.total, cx, 168);
      ctx.font = "11px ui-monospace, Consolas, monospace"; ctx.fillStyle = inkSoft;
      ctx.fillText(entry.verdict.stampSmall.toUpperCase(), cx, 188);
      if (entry.won){
        ctx.font = "700 13px ui-monospace, Consolas, monospace"; ctx.fillStyle = color;
        ctx.fillText("🏆 VENCEDOR", cx, 218);
      }
    }
    block(A, W * 0.26, "Item A");
    block(B, W * 0.74, "Item B");

    ctx.strokeStyle = lineCol; ctx.setLineDash([3,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2, 76); ctx.lineTo(W/2, 230); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = "700 11px ui-monospace, Consolas, monospace"; ctx.fillStyle = inkSoft;
    ctx.fillText("VS", W/2, 156);

    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.fillText("VALE A PENA? · COMPARAÇÃO DE COMPRAS", W/2, H - 26);

    return canvas;
  }

  function shareOrDownloadCanvas(canvas, filename, shareText){
    canvas.toBlob(function(blob){
      if (!blob) return;
      var didShare = false;
      try {
        if (navigator.share && navigator.canShare){
          var file = new File([blob], filename, {type: "image/png"});
          if (navigator.canShare({files: [file]})){
            navigator.share({files: [file], title: "Vale a Pena?", text: shareText || ""}).catch(function(){});
            didShare = true;
          }
        }
      } catch(e){ didShare = false; }
      if (!didShare){
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      }
    }, "image/png");
  }

  // ---- Quick nav (always visible) ----
  document.querySelectorAll(".quicknav button").forEach(function(b){
    b.addEventListener("click", function(){
      var nav = b.getAttribute("data-nav");
      if (nav === "home"){ state = defaultState(); }
      else if (nav === "history"){ state.view = "history"; }
      else if (nav === "goals"){ state.view = "goals"; }
      else if (nav === "earn"){ state.view = "earn"; }
      else if (nav === "stocks"){ state.view = "stocks"; }
      else if (nav === "wallet"){ state.view = "wallet"; }
      else if (nav === "agenda"){ state.view = "agenda"; }
      render();
    });
  });

  render();
})();
</script>
